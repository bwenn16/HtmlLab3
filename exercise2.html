<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Exercise 2</title>
</head>

<body>

    <h1>Navigator Example</h1>

    <p id="output"></p>

    <script>

        let language = navigator.language;

        document.getElementById("output").innerHTML =
            "Your preferred language is: " + language;

    </script>

</body>

</html>
